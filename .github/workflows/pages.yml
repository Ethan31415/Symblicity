name: Deploy Symblicity Playground

on:
  push:
    branches: [main]
    paths:
      - 'examples/battleship.sym'
      - 'src/symblicity.c'
      - 'Makefile'
      - 'tests/file_write.sym'
      - 'tests/file_read.sym'
      - 'tests/time_byte.sym'
      - 'README.md'
      - 'docs/LANGUAGE.md'
      - 'docs/CONVENTIONS.md'
      - 'web/site.tar.gz'
      - 'web/patch_site.py'
      - 'web/make_battleship_sounds.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build and test native VM
        run: make test

      - name: Extract browser site
        run: |
          mkdir -p _site
          tar -xzf web/site.tar.gz -C _site

      - name: Install FFmpeg for audio build
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Battleship audio
        run: |
          python3 web/make_battleship_sounds.py _site/audio

      - name: Apply browser hotfixes
        run: |
          python3 web/patch_site.py _site

      - name: Validate browser JavaScript
        run: |
          cp _site/app.js /tmp/app.mjs
          cp _site/symblicity.js /tmp/symblicity.mjs
          node --check /tmp/app.mjs
          node --check /tmp/symblicity.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
