name: Deploy Symblicity Playground

on:
  push:
    branches: [main]
    paths:
      - 'web/site.tar.gz'
      - 'web/patch_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Extract browser site
        run: |
          mkdir -p _site
          tar -xzf web/site.tar.gz -C _site

      - name: Apply browser hotfixes
        run: |
          python3 web/patch_site.py _site

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
